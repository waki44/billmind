services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billmind
      POSTGRES_PASSWORD: billmind
      POSTGRES_DB: billmind
    ports:
      - "5432:5432"
    volumes:
      - billmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billmind -d billmind"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://billmind:billmind@db:5432/billmind
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
      - billmind_uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  billmind_pgdata:
  billmind_uploads:
